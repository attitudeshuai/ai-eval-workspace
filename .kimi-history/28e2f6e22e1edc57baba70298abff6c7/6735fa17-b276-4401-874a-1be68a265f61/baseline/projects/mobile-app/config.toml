[project]
id = "mobile-app"
name = "移动端应用开发评估"
description = "评估 agent 在移动端 Web / React Native 场景下的工程能力"
owner = "ai-evaluation-workspace"
created_at = "2026-07-10T14:20:50.147615+00:00"

[paths]
tasks_dir = "tasks"
templates_dir = "templates"
rubrics_dir = "rubrics"
docs_dir = "docs"

[evaluation]
default_agents = ["codex", "claude-code", "kimi-coding"]
default_timeout_minutes = 30
screenshot_widths = [1920, 768, 390]
required_evidence_types = ["screenshot", "dom_assertion", "playwright_assertion"]

[quality_gates]
run_starter_locally = true
run_tests = true
run_sota_once = true
review_rubric = true
