<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办清单 · Todo</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --primary: #4f6ef7;
      --primary-dark: #3d55d6;
      --danger: #e5534b;
      --text: #1f2328;
      --muted: #8b949e;
      --border: #e4e7ec;
      --done: #9aa4af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      padding: 28px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    #todo-input:focus {
      border-color: var(--primary);
    }

    #add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #add-btn:hover {
      background: var(--primary-dark);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #clear-done {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }

    #clear-done:hover {
      color: var(--danger);
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
    }

    li:last-child {
      border-bottom: none;
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    li .text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
    }

    li.done .text {
      color: var(--done);
      text-decoration: line-through;
    }

    li .delete {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
    }

    li .delete:hover {
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>待办清单</h1>
    <p class="subtitle">添加、勾选、删除，刷新后依然保留。</p>

    <div class="input-row">
      <input id="todo-input" type="text" placeholder="要做点什么？" autocomplete="off" />
      <button id="add-btn">添加</button>
    </div>

    <div class="toolbar">
      <span id="counter">共 0 项，未完成 0 项</span>
      <button id="clear-done">清除已完成</button>
    </div>

    <ul id="todo-list"></ul>
    <p class="empty" id="empty-tip">暂无待办，先添加一条吧。</p>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "todo-list-items";
      const listEl = document.getElementById("todo-list");
      const inputEl = document.getElementById("todo-input");
      const addBtn = document.getElementById("add-btn");
      const counterEl = document.getElementById("counter");
      const clearDoneBtn = document.getElementById("clear-done");
      const emptyTip = document.getElementById("empty-tip");

      let items = load();

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function addItem(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        items.push({ id: Date.now(), text: trimmed, done: false });
        save();
        render();
      }

      function toggleItem(id) {
        const item = items.find((it) => it.id === id);
        if (item) {
          item.done = !item.done;
          save();
          render();
        }
      }

      function deleteItem(id) {
        items = items.filter((it) => it.id !== id);
        save();
        render();
      }

      function clearDone() {
        items = items.filter((it) => !it.done);
        save();
        render();
      }

      function render() {
        listEl.innerHTML = "";
        items.forEach((item) => {
          const li = document.createElement("li");
          if (item.done) li.className = "done";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = item.done;
          checkbox.addEventListener("change", () => toggleItem(item.id));

          const text = document.createElement("span");
          text.className = "text";
          text.textContent = item.text;

          const del = document.createElement("button");
          del.className = "delete";
          del.textContent = "×";
          del.title = "删除";
          del.addEventListener("click", () => deleteItem(item.id));

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(del);
          listEl.appendChild(li);
        });

        const total = items.length;
        const remaining = items.filter((it) => !it.done).length;
        counterEl.textContent = "共 " + total + " 项，未完成 " + remaining + " 项";
        emptyTip.style.display = total === 0 ? "block" : "none";
      }

      addBtn.addEventListener("click", () => {
        addItem(inputEl.value);
        inputEl.value = "";
        inputEl.focus();
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          addItem(inputEl.value);
          inputEl.value = "";
        }
      });

      clearDoneBtn.addEventListener("click", clearDone);

      render();
    })();
  </script>
</body>
</html>
