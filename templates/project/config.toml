[project]
id = "{{project_id}}"
name = "{{project_name}}"
description = "{{description}}"
owner = "ai-evaluation-workspace"
created_at = "{{created_at}}"
task_prefix = "{{project_id}}-task"

[paths]
tasks_dir = "tasks"
templates_dir = "templates"
rubrics_dir = "rubrics"
docs_dir = "docs"

[evaluation]
default_agents = ["codex", "claude-code", "kimi-coding"]
default_timeout_minutes = 30
screenshot_widths = [1920, 768, 390]
required_evidence_types = ["screenshot", "dom_assertion", "playwright_assertion"]

[quality_gates]
run_starter_locally = true
run_tests = true
run_sota_once = true
review_rubric = true
