[project]
id = "{{project_id}}"
name = "{{project_name}}"
description = "{{description}}"
owner = "ai-evaluation-workspace"
created_at = "{{created_at}}"
task_prefix = "{{project_id}}-task"

[paths]
# 项目内部目录相对路径（可选，以下为常见约定）
tasks_dir = "tasks"
templates_dir = "templates"
rubrics_dir = "rubrics"
docs_dir = "docs"

