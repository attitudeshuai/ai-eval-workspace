# cc-solo 本地敏感配置（模板）
# 将此文件复制为 secrets.toml 并填入真实值
# secrets.toml 已在 .gitignore 中排除，不会提交到 Git
# 每个开发者根据自己的本地环境修改

# ---- 本地路径（覆盖 config.toml 中的默认值） ----
# 工作根目录（相对于 ai-eval-workspace 根目录）
work_root = "sessions/cc-solo"
# 会话内代码根（source-code/{项目}/ 为素材源；其下 source-code/{项目}/{项目}-{类型}/{项目}-{类型}-{索引}/ 为任务副本）
repo_base_path = "source-code"
# 会话内任务记录根
records_dir = "records"

# ---- 当前 session ----
# 当前活跃的工作期名称，如 session-0907（新的一天/新一期，新建目录并改这里即可切换）
active_session = "session-0907"

# ---- 标注人/TPM（用于提交表内部备注字段） ----
annotator = ""
# 数据提交截止约定：当天 20:00 前产生的数据当天提交；20:00 后产生的数据次日 14:00 前提交

# ---- GitHub（为每个任务「新建独立远程仓库」并推送干净基线） ----
# github_pat 为个人访问令牌（细粒度/经典 token，需 repo + 创建仓库权限）；敏感，勿提交
github_pat = ""
# 拥有创建仓库权限的 GitHub 账号（任务新建仓库 cc-solo-{任务} 归属此账号）
github_username = "qianmo317"

# ---- 飞书（投递正式提交表到多维表格） ---- [已退役 2026-09-10]
# 不再投递飞书，改为走下面的 [submission] 提交接口；以下仅为历史兼容保留。
# app_token / table_id 在 config.toml [feishu]（非敏感）。
# app_id / app_secret 默认复用 projects/code-eval-gsb/secrets.toml [feishu]，
# 若 cc-solo 需要用独立应用，则在此填写并会覆盖 GSB 的凭证：
# [feishu]
# app_id = ""
# app_secret = ""

# ---- 提交接口（评价结果 → 平台表单；一轮 = 一条记录） ----
# 非敏感项（upload_url / 附件字段名）在 config.toml [submission]；这里只放敏感信息与待补的提交 URL。
# [submission]
# submit_url = "https://<待管理员提供>/api/v1/submissions"           # 提交接口（拿到后填这里）
# upload_url = "https://solo2.jzxhnh.com/api/v1/submissions/upload"  # 可选，默认取 config.toml
# cookie = "solo_qa_session=...; solo_qa_csrf=..."                   # 浏览器里复制的整条 cookie（会过期，需更新）
# csrf_header = ""                                                   # 若接口要求 X-CSRF-Token，填 csrf 的值

# ---- Harness 版本（Claude Code 客户端版本，按操作系统分行；随系统升级只改这里） ----
[harness]
claude_code_version_mac = "2.1.197"
claude_code_version_windows = "2.1.236"

# ---- Claude Code 网关（Docker 容器内 Claude Code 的连接配置；临时，后续会改） ----
# base_url / model 非敏感（镜像内通常已固化）；apikey 敏感，运行容器时以 -e "apikey=<此值>" 传入
# 真实值只写进 secrets.toml（gitignore），不要写进本模板（本文件会被提交）
[claude_gateway]
base_url = ""
apikey = ""
model = ""
