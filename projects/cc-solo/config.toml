# 表头：User Prompt/SessionID/TurnID/PromptID/初始环境快照/环境可复现等级/Harness/
#   Harness 版本/操作系统/任务类型/任务难度/语言/框架/五维分数与「X - 描述」/其他问题/提交人/提交时间/父记录
