[project]
id = "cc-solo"
name = "cc-solo 单模型代码评估（容器化）"
description = "从一份素材源码出发，按 7 类任务批量生成「任务副本 + 提示词」，每题一个容器执行（容器内 /workspace = 本题任务副本内容），导出轨迹与代码，按五维打分并导出结果。合并了 code-eval-solo 的「按类型批量出题 + 全局索引」与 claudccode 的「容器执行 + 会话/轮次 + 五维打分」。"
owner = "ai-evaluation-workspace"
created_at = "2026-09-07T00:00:00Z"

# ============================================================
# 项目模式说明
# ============================================================
#   1. 素材源 = 一份源码仓库（唯一 git 仓库 = base commit 快照）
#   2. 任务副本 = 素材源复制成多份，按任务类型分组、全局索引累加，目录名改为任务名（暂不建每份独立 git、不提交/push）
#   3. 执行 = 1 任务 1 容器（容器名 cc-solo-{任务}），容器内 /workspace = 本题任务副本内容
#      （Windows 直接挂载任务副本目录；Mac 新隔离镜像要求启动时为空，由 agent 在启动后播种）
#   4. 一轮 = 一次交互（用户提问 + 模型回答）= 一条数据；一个任务（会话窗口）≤ 10 轮
#   5. 打分：五维（交付完整性/指令遵循/任务规划/推理能力/执行能力）1-5，每轮单独打分
#   6. 导出：TODO（最终交付格式未定）
#   7. 质量红线：AI 生成的提示词与交付文本必须先经 humanizer-zh 去 AI 化 + 人工复核后再使用/投递
# ============================================================

[paths]
# ---- 所有路径以 ai-eval-workspace 为基准（工作台内闭环，不引用外部） ----
# work_root: session 工作数据根目录，拼接为 work_root/{SESSION_NAME}/
work_root = "sessions/cc-solo"
# repo_base_path: 素材源 + 任务副本根，拼接为 work_root/{SESSION_NAME}/{repo_base_path}/
#   结构：source-code/{项目}/ 下，素材源内容 + 按类型分组 {项目}-{类型}/{项目}-{类型}-{索引}/
repo_base_path = "source-code"
# records_dir: 任务记录根（提示词/轨迹/打分），拼接为 work_root/{SESSION_NAME}/{records_dir}/
#   结构：records/{项目}/{项目}-{类型}/{项目}-{类型}-{索引}.md
records_dir = "records"
# deliverables: 导出输出根
deliverables_root = "deliverables/cc-solo"

# 任务信息文件（每个任务目录下一份，存共享的会话/环境字段）
session_task_info = "task-info.md"
# 每轮数据文件命名：{任务}-R{NN}.md（NN 两位补零；TASK_ID = 任务 ID = {项目}-{类型slug}）
round_file_prefix = "R"

[task_types]
# 支持的 7 种任务类型（按本轮对话的主要意图归类，一轮只选一个）
types = [
    "0-1代码生成",
    "Feature迭代",
    "Bug修复",
    "代码理解",
    "代码重构",
    "工程化",
    "代码测试"
]
# 类型别名映射（用户输入简写 → 标准名称；同时也是任务 ID 的后缀 slug：{任务} = {项目}-{slug}）
aliases = { "codegen" = "0-1代码生成", "feat" = "Feature迭代", "bugfix" = "Bug修复", "understand" = "代码理解", "refactor" = "代码重构", "engineering" = "工程化", "test" = "代码测试" }

# 按天维度的分布偏序（优先级从高到低分组）：
#   0-1代码生成 / Feature迭代 / Bug修复 > 代码理解 ≈ 代码重构 > 其他
distribution_priority = [
    ["0-1代码生成", "Feature迭代", "Bug修复"],
    ["代码理解", "代码重构"],
    ["工程化", "代码测试"]
]

[difficulty]
# 任务难度（从人类执行的视角判断）
levels = ["简单", "中等", "困难", "地狱"]
# 首轮任务严禁提交「简单」；后续轮次中因模型产物质量不佳而产生的简单 bugfix 可提交
first_round_forbidden = ["简单"]

[harness]
# 承载模型的客户端；决定 system prompt、工具集与 agent loop
# 同一模型在不同 Harness 下的表现不可直接互比
options = ["Claude Code"]
# Claude Code 客户端版本按操作系统分行，见 secrets.toml [harness]（不进 git，随系统换版本不改 git 文件）：
#   claude_code_version_mac     → 本机 Claude Code 版本
#   claude_code_version_windows → Windows 容器镜像内 claude --version 输出

[os]
options = ["MacOS/Linux", "Windows"]

[trajectory]
# 轨迹文件在容器内 /home/node/.claude/projects/-workspace/（工作目录恒为 /workspace，不再有 -workspace-<题号>），导出到本机 records/<TASK_ID>/<TASK_ID>-trajectory.jsonl
# task-info「轨迹根目录（轨迹文件）」填对应路径；导出/质检校验前缀一致性
claude_root = "~/.claude/projects"

[container]
# 容器模型（1 任务 = 1 会话 = 1 容器 = 1 本机工作目录）
# name_prefix：容器名统一前缀，容器名 = cc-solo-{任务}（如 cc-solo-app-12-bugfix-01）
name_prefix = "cc-solo-"
# image_mac / image_windows：按操作系统固定的镜像 tag（勿用 latest；Mac 按 digest 记账）
image_mac = "adminfather/benzhi-claude-code:20260909-isolated-git"
image_windows = "nicehey/benzhi-claude-code:1.0"
# workspace_in_container：容器内工作目录恒为 /workspace（= 本题任务副本内容）
workspace_in_container = "/workspace"
# trajectory_dir_in_container：容器内轨迹根目录（工作目录为 /workspace 时恒定此路径）
trajectory_dir_in_container = "/home/node/.claude/projects/-workspace"

[reproducibility]
# 环境可复现等级：用于筛选可做同题双跑的样本
#   无外部依赖：clone 后即可运行
#   有外部依赖，未容器化：依赖数据库/外部服务/本机特定配置，无法直接重跑
#   已容器化，可一键起环境：仓库内提供 docker-compose 或等价一键启动方式
levels = ["无外部依赖", "有外部依赖，未容器化", "已容器化，可一键起环境"]

[scoring]
# 五维打分（每轮单独打分，1-5 整数；五个「-描述」均必填）
dimensions = ["交付完整性", "指令遵循", "任务规划", "推理能力", "执行能力"]
score_min = 1
score_max = 5

[limits]
# 一个会话窗口内不超过 10 轮对话；对话满 10 轮后无论是否完成任务都不应继续引导
max_rounds = 10

[sessions]
# 当前活跃的 session 名称，切换时只需改这一行
active = "session-0909"

[naming]
# 任务名 = {项目}-{类型}-{索引}（如 app-12-bugfix-01），记录目录与轮次文件都以它为前缀。
#   {项目} = 项目名（source-code/{项目}/ 的目录名）= 素材源名；{类型} 见 [task_types].aliases；{索引} 全局累加两位补零。
#   一份素材源按 7 类任务复制成多份任务副本（{项目}-{类型}/{项目}-{类型}-{索引}/），各任务独立目录。
# 保留 task_prefix 仅为兼容旧写法/命名提示；新建任务不再拼成 cc-N。
task_prefix = "cc-solo"

[github]
# 为每个任务「新建独立远程仓库」并推送干净基线用。
# username = 拥有创建仓库权限的 GitHub 账号；PAT 写在 secrets.toml [github] github_pat（敏感，不进 git）
username = ""

[delivery]
# 评价结果文件命名：{delivery.filename_prefix}-{SESSION_NAME}-{date}.json / .csv / -质检报告.md
# （旧的「正式提交表 CSV + 飞书投递」已退役，见 skills/04-export-submit.md）
filename_prefix = "评价结果"

# ============================================================
# 提交接口（评价结果 → 平台表单；一轮 = 一条记录）
# ============================================================
# 字段规范（24 个字段，含选项/必填/校验）由前端定义抽取：
#   python scripts/cc-solo/extract_submit_fields.py
# ============================================================
# 样例/练习项目：不导出、不提交
# ============================================================
# `records/{项目}/` 下这些目录只是样例或练习留下的，**一律不进交付文件、不提交**：
#   - h5-demo：样例项目，快照填的是本地裸 SHA（不是 40 位 permalink）、首轮难度写了「简单」，
#     本就不满足提交要求；它只用于演示目录结构与流程。
# 导出脚本（build_eval_result.py）会按这份清单跳过，并在输出里打印跳过了哪几条。
# 以后有新的样例项目，往这个数组里加名字即可，不要靠临时参数或人工记得排除。
[exclude]
projects = ["h5-demo"]

# ============================================================
# 提交接口
# ============================================================
#   → projects/cc-solo/docs/submission/fields.json
# 敏感信息（cookie / 正式 submit_url）写在 secrets.toml [submission]，不进 git。
#
# 流程：
#   1) python scripts/cc-solo/build_eval_result.py                 # 生成评价结果 + 质检
#   2) python scripts/cc-solo/submit_eval_result.py --result <json> # 默认 dry-run
#   3) 确认后加 --commit（先 --upload-only --commit --write-back 只传轨迹）
[submission]
# 轨迹附件上传接口（来自前端定义，可在 secrets.toml 覆盖）
upload_url = "https://solo2.jzxhnh.com/api/v1/submissions/upload"
upload_form_field = "file"          # multipart 表单字段名
upload_response_path_key = "path"   # 返回体里作为附件标识的字段
# 提交接口（2026-09-10 拿到）：请求体 {"data": {24 字段}, "schema_fingerprint": "<fields.json 的 fingerprint>"}
#   trace_file 为附件数组 [{"name": "…-trajectory.jsonl", "path": "uploads/<id>.jsonl", "size": 321940}]
#   响应 {"id":1196,"status":"SUBMITTED","round_no":1,"schema_stale":false,"message":…}
# secrets.toml [submission].submit_url 若填写则优先于这里
submit_url = "https://solo2.jzxhnh.com/api/v1/submissions"
# 表单定义接口：生成/提交前先 GET 这个接口，把平台当前字段规范与本地 fields.json 比对，
# 防止平台表单改了本地还按旧规范生成/提交（实现见 scripts/cc-solo/check_form_schema.py）
form_schema_url = "https://solo2.jzxhnh.com/api/v1/submissions/form-schema"
# 登录接口：cookie（solo_qa_session / solo_qa_csrf）过期时，脚本用 secrets.toml [submission].username/password
# 自动登录刷新（请求体 {"username":…,"password":…}，从响应 Set-Cookie 取新 cookie 并回写 secrets.toml）
login_url = "https://solo2.jzxhnh.com/api/v1/auth/login"
attachment_max_mb = 20
# 返修排除名单：这些提交 ID 一律不整改、不更新（规则的最终判定还没定，动了会与别人正在对齐的
# 口径冲突）。scripts/cc-solo/list_pending_fix.py 默认读这里，并把它们从待处理清单里剔除；
# 临时覆盖用 --exclude id1,id2。增删请连同原因一起写在这里。
fix_exclude_ids = [4142, 4143, 4144]

