[project]
id = "cc-solo"
name = "cc-solo 单模型代码评估（容器化）"
description = "从一份素材源码出发，按 7 类任务批量生成「任务副本 + 提示词」，复制进容器按类型多份执行，回导轨迹与代码，按五维打分并导出结果。合并了 code-eval-solo 的「按类型批量出题 + 全局索引」与 claudccode 的「容器执行 + 会话/轮次 + 五维打分」。"
owner = "ai-evaluation-workspace"
created_at = "2026-09-07T00:00:00Z"

# ============================================================
# 项目模式说明
# ============================================================
#   1. 素材源 = 一份源码仓库（唯一 git 仓库 = base commit 快照）
#   2. 任务副本 = 素材源复制成多份，按任务类型分组、全局索引累加，目录名改为任务名（暂不建每份独立 git、不提交/push）
#   3. 执行 = 把各任务副本按类型复制进同一容器（/workspace/{项目}/…），模型在各副本独立工作目录上跑
#   4. 一轮 = 一次交互（用户提问 + 模型回答）= 一条数据；一个任务（会话窗口）≤ 10 轮
#   5. 打分：五维（交付完整性/指令遵循/任务规划/推理能力/执行能力）1-5，每轮单独打分
#   6. 导出：TODO（最终交付格式未定）
#   7. 质量红线：AI 生成的提示词与交付文本必须先经 humanizer-zh 去 AI 化 + 人工复核后再使用/投递
# ============================================================

[paths]
# ---- 所有路径以 ai-eval-workspace 为基准（工作台内闭环，不引用外部） ----
# work_root: session 工作数据根目录，拼接为 work_root/{SESSION_NAME}/
work_root = "sessions/cc-solo"
# repo_base_path: 素材源 + 任务副本根，拼接为 work_root/{SESSION_NAME}/{repo_base_path}/
#   结构：source-code/{项目}/ 下，素材源内容 + 按类型分组 {项目}-{类型}/{项目}-{类型}-{索引}/
repo_base_path = "source-code"
# records_dir: 任务记录根（提示词/轨迹/打分），拼接为 work_root/{SESSION_NAME}/{records_dir}/
#   结构：records/{项目}/{项目}-{类型}/{项目}-{类型}-{索引}.md
records_dir = "records"
# deliverables: 导出输出根
deliverables_root = "deliverables/cc-solo"

# 任务信息文件（每个任务目录下一份，存共享的会话/环境字段）
session_task_info = "task-info.md"
# 每轮数据文件命名：{任务}-R{NN}.md（NN 两位补零；TASK_ID = 任务 ID = {项目}-{类型slug}）
round_file_prefix = "R"

[task_types]
# 支持的 7 种任务类型（按本轮对话的主要意图归类，一轮只选一个）
types = [
    "0-1代码生成",
    "Feature迭代",
    "Bug修复",
    "代码理解",
    "代码重构",
    "工程化",
    "代码测试"
]
# 类型别名映射（用户输入简写 → 标准名称；同时也是任务 ID 的后缀 slug：{任务} = {项目}-{slug}）
aliases = { "codegen" = "0-1代码生成", "feat" = "Feature迭代", "bugfix" = "Bug修复", "understand" = "代码理解", "refactor" = "代码重构", "engineering" = "工程化", "test" = "代码测试" }

# 按天维度的分布偏序（优先级从高到低分组）：
#   0-1代码生成 / Feature迭代 / Bug修复 > 代码理解 ≈ 代码重构 > 其他
distribution_priority = [
    ["0-1代码生成", "Feature迭代", "Bug修复"],
    ["代码理解", "代码重构"],
    ["工程化", "代码测试"]
]

[difficulty]
# 任务难度（从人类执行的视角判断）
levels = ["简单", "中等", "困难", "地狱"]
# 首轮任务严禁提交「简单」；后续轮次中因模型产物质量不佳而产生的简单 bugfix 可提交
first_round_forbidden = ["简单"]

[harness]
# 承载模型的客户端；决定 system prompt、工具集与 agent loop
# 同一模型在不同 Harness 下的表现不可直接互比
options = ["Claude Code"]
# Claude Code 客户端版本按操作系统分行，见 secrets.toml [harness]（不进 git，随系统换版本不改 git 文件）：
#   claude_code_version_mac     → 本机 Claude Code 版本
#   claude_code_version_windows → Windows 容器镜像内 claude --version 输出

[os]
options = ["MacOS/Linux", "Windows"]

[trajectory]
# 轨迹文件在容器内 /home/node/.claude/projects/-workspace-<题号>/，导出到本机 records/<TASK_ID>/<TASK_ID>-trajectory.jsonl
# task-info「轨迹根目录（轨迹文件）」填对应路径；导出/质检校验前缀一致性
claude_root = "~/.claude/projects"

[reproducibility]
# 环境可复现等级：用于筛选可做同题双跑的样本
#   无外部依赖：clone 后即可运行
#   有外部依赖，未容器化：依赖数据库/外部服务/本机特定配置，无法直接重跑
#   已容器化，可一键起环境：仓库内提供 docker-compose 或等价一键启动方式
levels = ["无外部依赖", "有外部依赖，未容器化", "已容器化，可一键起环境"]

[scoring]
# 五维打分（每轮单独打分，1-5 整数；五个「-描述」均必填）
dimensions = ["交付完整性", "指令遵循", "任务规划", "推理能力", "执行能力"]
score_min = 1
score_max = 5

[limits]
# 一个会话窗口内不超过 10 轮对话；对话满 10 轮后无论是否完成任务都不应继续引导
max_rounds = 10

[sessions]
# 当前活跃的 session 名称，切换时只需改这一行
active = "session-0907"

[naming]
# 任务名 = {项目}-{类型}-{索引}（如 app-12-bugfix-01），记录目录与轮次文件都以它为前缀。
#   {项目} = 项目名（source-code/{项目}/ 的目录名）= 素材源名；{类型} 见 [task_types].aliases；{索引} 全局累加两位补零。
#   一份素材源按 7 类任务复制成多份任务副本（{项目}-{类型}/{项目}-{类型}-{索引}/），各任务独立目录。
# 保留 task_prefix 仅为兼容旧写法/命名提示；新建任务不再拼成 cc-N。
task_prefix = "cc-solo"

[github]
# 为每个任务「新建独立远程仓库」并推送干净基线用。
# username = 拥有创建仓库权限的 GitHub 账号；PAT 写在 secrets.toml [github] github_pat（敏感，不进 git）
username = ""

[delivery]
# 正式提交表命名：{delivery.filename_prefix}-{SESSION_NAME}-{date}.csv
filename_prefix = "正式提交表"

# ============================================================
# 飞书多维表格（正式提交表投递目标，每轮一条数据=追加一条记录）
