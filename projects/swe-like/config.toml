[project]
id = "swe-like"
name = "SWE-like 长程代码任务题库"
description = "基于真实开源 Repo 出 SWE 类真实难题，Trae/TraeX/miniswe + Seed Evolving 单 Prompt 运行，Verify Rubric 验收，按收录标准以伪 Harbor zip 形式交付网站"
owner = "ai-evaluation-workspace"
created_at = "2026-09-01T00:00:00Z"

# ============================================================
# 项目模式说明（现行 · SWE-like Repo-v3）
# ============================================================
#   1. 选择熟悉的开源 Repo，记录 URL + 40 位完整 commit（base_commit）
#   2. 基于真实使用场景独立出题（不照抄 Issues，也不做「同一诉求内置化改写」）
#   3. 交付形态：一题一个 zip（task.toml + instruction.md + nl_rubric.yaml + Dockerfile + evidence/）
#   4. Trae/TraeX/miniswe + Seed Evolving 单 Prompt 单轮运行
#   5. 有效轮数 = agent step（一次模型调用 = 1 步），TraeX 用 count_steps.py，miniswe 取 api_calls
#   6. 收录标准：>100 长程；≤100 且完成 → 不收录；≤100 且未完成 → 难题
#   7. 用 toml2base.py 一键回填底稿（网站表单），不再交付飞书
#
# ============================================================

[paths]
# ---- 所有路径以 ai-eval-workspace 为基准 ----
work_root = "sessions/swe-like"

[task]
# 任务类型（与底稿「任务类型」单选字段逐字一致）
task_types = [
    "功能新增",
    "Bug 修复",
    "测试增强",
    "重构/性能",
    "配置/工具链",
    "其他",
]
# 主要语言：本批次仅 Python / Go
languages = ["Go", "Python"]
# 收录阈值：有效轮数 > 该值 → 长程题
long_horizon_min_rounds = 100
# 单 repo 最多提交条数上限
max_tasks_per_repo = 5

[run]
# 运行环境与纪律（推荐 TraeX：有效轮数可用 count_steps.py 自动统计；Trae IDE 需用 Hook 方式，见 docs/内部规范-v1.md）
harness = "TraeX"         # Trae / TraeX / miniswe
model = "Seed Evolving"
# 单 Prompt 单轮：运行过程中不追加人工澄清、任务拆解或引导性提示
single_prompt = true
# 有效轮数 = agent step（一次模型调用 = 1 步），口径见 skills/02-step-count.md
# 省积分：执行超过 2 小时可停止，按「>100 轮且效果差」提交（见 docs/内部规范-v1.md）
run_time_cap_hours = 2.0

[review]
# Verify Rubric（nl_rubric.yaml）验收前固定，评判口径一致，不得事后调整
rubric_frozen_before_review = true

[sessions]
# 当前活跃 session
active = "session-0001"
