# 自然语言判分标准（见规范第 5 节）。每条一句自然语言，只额外标 type。
# type 取小写：f2p = 原本做不对、新需求下应该做对；p2p = 原本就能做对、新需求下也应该做对。
# 整体不少于 5 条，且至少各有 1 条 f2p 和 1 条 p2p。
# 不拆到字段级，也不写死文件名、类名或实现方案。

rubrics:
  - id: 1
    type: f2p
    text: <参数与默认值：新能力在哪些公开入口暴露，默认开启还是关闭。>

  - id: 2
    type: f2p
    text: <主路径行为：在什么输入条件下，应观察到什么结果。>

  - id: 3
    type: f2p
    text: <边界与异常：错误、重试、并发或缺省状态下的预期行为。>

  - id: 4
    type: f2p
    text: <可观察接口：对外可检查的返回值、状态码、日志或统计口径。>

  - id: 5
    type: p2p
    text: <回归要求：既有行为不得回归，Repo 原有测试仍需通过。>
