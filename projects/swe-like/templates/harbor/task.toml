# harbor 交付模板 · task.toml
# 16 个键，与底稿列一一对应；不要自行增删或改名。
# 除 submitter 外，每个键对应一个底稿列，由 toml2base.py 一键回填。

title       = ""            # 题目名称（与 zip 目录名一致）
submitter   = ""            # 提交人（不回填底稿，底稿里圈自己）
submit_date = ""            # YYYY-MM-DD
language    = "Python"      # 本批次只可填 Python / Go
task_type   = "功能新增"     # 功能新增 / Bug 修复 / 测试增强 / 重构/性能 / 配置/工具链 / 其他
repo_url    = ""            # 原始仓库 URL
base_commit = ""            # 40 位完整 SHA，须与 Dockerfile 的 ARG BASE_SHA 一致

realism_and_difficulty = """
真实性与难度说明写在这里。
"""

modules = ""                # 可能涉及模块

trae_session_id = ""        # harness 为 miniswe 时可留空
effective_turns = 0         # 整数，环境重试不计入（agent step 口径）
harness         = "Trae"    # Trae / TraeX / miniswe
seed_model      = "Seed Evolving"
requirement_met = "完成"     # 完成 / 部分完成 / 未完成 / 无法判断

run_result = """
逐条对应 rubric，每条一行：rubric id + 通过/未通过 + 未通过原因
1 通过
2 通过
"""

notes = ""
