[project]
id = "webdev-long-horizon"
name = "高难度 Web Dev 长程任务"
description = "评估 agent 在复杂前端工程、长程任务、视觉还原与浏览器验证方面的能力"
owner = "ai-evaluation-workspace"
created_at = "2026-07-10T00:00:00Z"
task_prefix = "webdev-task"

[paths]
tasks_dir = "tasks"
templates_dir = "templates"
rubrics_dir = "rubrics"
docs_dir = "docs"
# 任务内部文件命名约定（相对任务目录）
task_metadata = "metadata.json"
task_readme = "README.md"
task_requirements = "task.md"
task_rubric = "rubric.json"
task_target_states = "target_states.md"
task_starter = "starter"
task_assets = "assets"
task_mock_data = "mock-data"
task_tests = "tests"
task_screenshots = "screenshots"
task_sota_run = "sota-run.md"
# 当任务不使用 task/starter 时，源码默认放到 projects/<project>/sources/<task-id>/
task_source = "sources"

[evaluation]
default_agents = ["codex", "claude-code", "kimi-coding"]
default_timeout_minutes = 30
screenshot_widths = [1920, 768, 390]
required_evidence_types = ["screenshot", "dom_assertion", "playwright_assertion"]

[quality_gates]
run_source_locally = true
run_tests = true
run_sota_once = true
review_rubric = true

[difficulty]
min_rubric_leaves = 10
max_rubric_leaves = 20
min_key_states = 4
required_visual_input = true
required_browser_tools = true
