[project]
id = "webdev-long-horizon"
name = "高难度 Web Dev 长程任务"
description = "评估 agent 在复杂前端工程、长程任务、视觉还原与浏览器验证方面的能力"
owner = "ai-evaluation-workspace"
created_at = "2026-07-10T00:00:00Z"
task_prefix = "webdev-task"

[paths]
tasks_dir = "tasks"
templates_dir = "templates"
rubrics_dir = "rubrics"
docs_dir = "docs"

[evaluation]
default_agents = ["codex", "claude-code", "kimi-coding"]
default_timeout_minutes = 30
screenshot_widths = [1920, 768, 390]
required_evidence_types = ["screenshot", "dom_assertion", "playwright_assertion"]

[quality_gates]
run_starter_locally = true
run_tests = true
run_sota_once = true
review_rubric = true

[difficulty]
min_rubric_leaves = 10
max_rubric_leaves = 20
min_key_states = 4
required_visual_input = true
required_browser_tools = true
