[project]
id = "code-eval-gsb"
name = "多模型代码对比评估（GSB）"
description = "评估多个 AI 模型在相同代码任务下的相对表现，支持 1v1、2v1、三模型对比等模式。通过 GitHub 分支隔离各模型代码，按维度打分并输出 GSB 对比结论。"
owner = "ai-evaluation-workspace"
created_at = "2026-07-26T00:00:00Z"

# ============================================================
# 项目模式说明
# ============================================================
#   1. 源码放置 → GitHub 推送 → 创建模型分支
#   2. 生成统一提示词供所有模型共享
#   3. 用户在 Trae 中各模型分支分别执行
#   4. 逐轮评价 → 汇总 GSB 对比结论
#
# ============================================================

[paths]
# ---- 所有路径以 ai-eval-workspace 为基准（工作台内闭环，不引用外部） ----
work_root = "sessions/code-eval-gsb"
# 源码子目录（拼接为 work_root/{SESSION_NAME}/{source_dir}/）
source_dir = "source code"
# 结果目录名（拼接在 work_root/{SESSION_NAME}/ 下）
result_dir = "ai-model-result"

[task_types]
# 支持的 7 种任务类型（与 code-eval-solo 一致）
types = [
    "Bug修复",
    "0-1代码生成",
    "Feature迭代",
    "代码理解",
    "工程化",
    "代码重构",
    "代码测试"
]

# 类型别名映射（用户输入简写 → 标准名称）
# 文件/目录以别名命名，CSV 导出仍用源类型名
aliases = { "bugfix" = "Bug修复", "codegen" = "0-1代码生成", "feature" = "Feature迭代", "understand" = "代码理解", "engineering" = "工程化", "refactor" = "代码重构", "test" = "代码测试" }

# 0825 期出题分布（允许上下浮动 2%）
[task_types.distribution]
"Feature迭代" = 30
"Bug修复" = 25
"0-1代码生成" = 15
"代码重构" = 15
"代码理解" = 5
"工程化" = 5
"代码测试" = 5

[github]
# GitHub 推送配置
username = "attitudeshuai"
prefer_ssh = true

# ============================================================
# 模型配置（0825 期）
# ============================================================
# 列出所有参与评测的模型，slug 用于分支名和文件名后缀
# 换期或换模型时只改这里，skill 自动适配
# 本期 anchor：Odysseus（index 0）

[[models]]
name = "Odysseus"
slug = "odysseus"
display_name = "Odysseus"
role = "anchor"

[[models]]
name = "Athena"
slug = "athena"
display_name = "Athena"

[[models]]
name = "Poseidon"
slug = "poseidon"
display_name = "Poseidon"

[[models]]
name = "Cyclops"
slug = "cyclops"
display_name = "Cyclops"

# ============================================================
# 对比组合（0825 期：Anchor-based，固定 Odysseus 为 anchor，共 3 组）
# ============================================================
# 本期 GSB 不提供 Same 选项，必须二选一

[[comparisons]]
name = "Odysseus vs Athena"
pair = [0, 1]
required = true

[[comparisons]]
name = "Odysseus vs Poseidon"
pair = [0, 2]
required = true

[[comparisons]]
name = "Odysseus vs Cyclops"
pair = [0, 3]
required = true

[review]
# 轮次评价配置（0825 期：交互轮次 ≤ 3，无最低轮数要求）
# 首轮未完成可继续对话引导，但总轮次不得超过 3
# 例外：工程故障（网络波动导致请求失败）不计入轮次；轮次超限需人为"继续"的计入轮次
min_rounds = 1
max_rounds = 3
# 单项目单次仅生成 1 条提示词（GSB 模式固定单条）
prompts_per_project = 1

[execution]
# 0825 期执行环境要求
# Max 模式 60/40 分布：60% 任务开启 Max（更复杂/更长程任务），40% 不开启
# 同一任务（对话窗口）内必须保持一致，不可中途切换；同一任务所有横评模型必须一致
max_mode_ratio = 60
# 客户端：Trae CN + SOLO Agent 模式（关闭 Auto，选择内部策略模型）
trae_mode = "SOLO Agent"
# PPE 配置（写入 settings.json）
ppe_env = "ppe"
ppe_name = "ppe_trae_seed_code_dogfood"

[analysis]
# 分析维度：5 基础（1-5 打分）+ 4 Add-on（Bad Pattern + 描述，不打分）
dimensions = ["交付完整性", "指令遵循", "任务规划", "推理能力", "执行能力"]
addon_dimensions = ["边界感", "长上下文保持", "思考效率", "工具调用效率"]
score_min = 1
score_max = 5
# GSB 结论：本期不提供 Same 选项，必须二选一
gsb_allow_same = false
# 是否需要 humanizer-zh 去 AI 化
use_humanizer = true
# 长程任务判定：修改文件数 ≥ N
long_task_min_files = 5

[sessions]
# 当前活跃 session（各开发者在 secrets.toml 中覆盖）
active = "session-0825"

[secrets]
# 敏感配置集中管理文件（已加入 .gitignore，不提交）
# 首次使用请复制 secrets-simple.toml → secrets.toml 并填入真实值
file = "secrets.toml"
template = "secrets-simple.toml"

# ============================================================
# 飞书多维表格（交付导出目标，替代原 Excel 追加）
# ============================================================
