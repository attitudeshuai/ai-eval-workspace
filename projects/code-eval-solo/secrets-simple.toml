# code-eval-solo 本地敏感配置（模板）
# 将此文件复制为 secrets.toml 并填入真实值
# secrets.toml 已在 .gitignore 中排除，不会提交到 Git
# 每个开发者根据自己的本地环境修改

# ---- 本地路径（覆盖 config.toml 中的默认值） ----
# 工作根目录（相对于 ai-eval-workspace 根目录）
work_root = "sessions/code-eval-solo"
# 项目源码根目录（相对于 session 目录）
repo_base_path = "source code"

# ---- 当前 session ----
# 当前活跃的工作期名称，如 solo-demo
active_session = "solo-demo"

# ---- GitHub 认证 ----
# GitHub Personal Access Token（solo 模式一般不使用，预留）
github_pat = ""
github_username = "attitudeshuai"

# ---- 提示词生成配置（按 session 覆盖默认配额） ----
# 如需为特定 session 调整类型配额，在此声明
# [session_quotas."solo-0601"]
# Bug修复 = 5
# 0-1代码生成 = 5
