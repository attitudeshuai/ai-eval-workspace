# claudccode 本地敏感配置（模板）
# 将此文件复制为 secrets.toml 并填入真实值
# secrets.toml 已在 .gitignore 中排除，不会提交到 Git
# 每个开发者根据自己的本地环境修改

# ---- 本地路径（覆盖 config.toml 中的默认值） ----
# 工作根目录（相对于 ai-eval-workspace 根目录）
work_root = "sessions/claudccode"
# 会话内被标注仓库的工作副本根
repo_base_path = "repos"
# 会话内任务记录根
records_dir = "records"

# ---- 当前 session ----
# 当前活跃的工作期名称，如 session-0907（新的一天/新一期，新建目录并改这里即可切换）
active_session = "session-0907"

# ---- 标注人/TPM（用于提交表内部备注字段） ----
annotator = ""
# 数据提交截止约定：当天 20:00 前产生的数据当天提交；20:00 后产生的数据次日 14:00 前提交

# ---- GitHub（为每个任务「新建独立远程仓库」并推送干净基线） ----
# github_pat 为个人访问令牌（细粒度/经典 token，需 repo + 创建仓库权限）；敏感，勿提交
github_pat = ""
# 拥有创建仓库权限的 GitHub 账号（任务新建仓库 claudccode-{REPO} 归属此账号）
github_username = "qianmo317"

# ---- 飞书（投递正式提交表到多维表格） ----
# app_token / table_id 在 config.toml [feishu]（非敏感）。
# app_id / app_secret 默认复用 projects/code-eval-gsb/secrets.toml [feishu]，
# 若 claudccode 需要用独立应用，则在此填写并会覆盖 GSB 的凭证：
# [feishu]
# app_id = ""
# app_secret = ""
